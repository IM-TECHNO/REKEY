# Edge proxy: the only thing exposed. Routes the API and the UI, and, crucially, OVERWRITES
# X-Forwarded-For with the address it actually saw, so a client cannot choose its own IP
# (Rekey's rate limits and audit IPs rely on that; REKEY_TRUSTED_PROXY_HOPS=1 matches this).
#
# If another proxy or load balancer sits in front of this one, make nginx see the real client:
#   set_real_ip_from <that proxy's address or network>;
#   real_ip_header   X-Forwarded-For;
#   real_ip_recursive on;
# and keep `proxy_set_header X-Forwarded-For $remote_addr;` below.
# Terminate TLS in front (or add it here) and add:
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control "no-store" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # The API (login redirects, secrets, admin) goes straight to the API container.
    location /v1/ {
        proxy_pass http://rekey-api:8000;
    }

    # Everything else is the web UI.
    location / {
        proxy_pass http://rekey-web:3000;
    }
}
