# Edge proxy: the only thing exposed. Routes the API and the UI, and, crucially, OVERWRITES
# X-Forwarded-For with the address it actually saw, so a client cannot choose its own IP
# (Rekey's rate limits and audit IPs rely on that; REKEY_TRUSTED_PROXY_HOPS=1 matches this).
#
# A proxy on the same host (your own nginx in front of this stack) reaches this container from
# Docker's bridge network, so that is the only network whose X-Forwarded-For is believed below; the
# outer proxy must SET the header to the client's address (see deploy/nginx/host-nginx.example.conf).
# A client connecting from anywhere else has its header ignored. If your Docker network uses another
# range (docker network inspect bridge), change it here.
# Terminate TLS in front (or add it here) and add:
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

set_real_ip_from 172.16.0.0/12;
real_ip_header    X-Forwarded-For;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control "no-store" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # The API (login redirects, secrets, admin) goes straight to the API container.
    location /v1/ {
        proxy_pass http://rekey-api:8000;
    }

    # Everything else is the web UI.
    location / {
        proxy_pass http://rekey-web:3000;
    }
}
