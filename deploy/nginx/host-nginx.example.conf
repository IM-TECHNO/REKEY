# For an nginx that already runs on the machine and terminates TLS. Rekey's stack is published on
# 127.0.0.1:11000 (REKEY_BIND=127.0.0.1, REKEY_PORT=11000 in .env).

server {
    listen 443 ssl;
    http2 on;
    server_name rekey.example.com;

    ssl_certificate     /etc/letsencrypt/live/rekey.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rekey.example.com/privkey.pem;

    server_tokens off;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:11000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # SET the client's address, never append ($proxy_add_x_forwarded_for): Rekey trusts this
        # value for rate limits and the audit log, and a client must not be able to choose it.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    server_name rekey.example.com;
    return 301 https://$host$request_uri;
}
