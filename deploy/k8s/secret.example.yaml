# EXAMPLE ONLY, not part of kustomization.yaml. Create the real secret without writing it to a file
# that gets committed, for instance:
#
#   kubectl -n rekey create secret generic rekey-secrets \
#     --from-literal=REKEY_DATABASE_URL='postgresql+asyncpg://rekey:<password>@<db host>:5432/rekey' \
#     --from-literal=REKEY_BOOTSTRAP_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=REKEY_OIDC_CLIENT_SECRET='<gitlab application secret>'
#
# Store the bootstrap token somewhere offline: it is the break-glass superadmin credential.
apiVersion: v1
kind: Secret
metadata:
  name: rekey-secrets
  namespace: rekey
type: Opaque
stringData:
  REKEY_DATABASE_URL: postgresql+asyncpg://rekey:CHANGE_ME@postgres.example:5432/rekey
  REKEY_BOOTSTRAP_TOKEN: CHANGE_ME_long_random_value
  REKEY_OIDC_CLIENT_SECRET: CHANGE_ME
