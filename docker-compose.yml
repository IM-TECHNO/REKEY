# Rekey on one machine: Postgres + API + web UI.
#
#   cp .env.example .env      # then edit it: generate real random values
#   docker compose up -d --build
#   open http://localhost:11000  (put a TLS reverse proxy in front for anything real)
#
# Only the edge proxy (nginx) is published. It sends /v1/* to the API and the rest to the UI, so
# the CLI, CI jobs and the browser all use the same address. First run: initialise and unseal,
# see docs/OPERATIONS.md.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: rekey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rekey
    volumes:
      - rekey-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rekey -d rekey"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]

  rekey-api:
    build:
      context: ./server
      network: host # image builds use the host's network: some VMs stall large downloads on the bridge
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      REKEY_DATABASE_URL: postgresql+asyncpg://rekey:${POSTGRES_PASSWORD}@db:5432/rekey
      REKEY_BOOTSTRAP_TOKEN: ${REKEY_BOOTSTRAP_TOKEN:?set REKEY_BOOTSTRAP_TOKEN in .env}
      REKEY_TRUSTED_PROXY_HOPS: "1" # the web UI proxy is one hop in front of the API
      REKEY_COOKIE_SECURE: ${REKEY_COOKIE_SECURE:-true}
      REKEY_OIDC_ISSUER: ${REKEY_OIDC_ISSUER:-}
      REKEY_OIDC_CLIENT_ID: ${REKEY_OIDC_CLIENT_ID:-}
      REKEY_OIDC_CLIENT_SECRET: ${REKEY_OIDC_CLIENT_SECRET:-}
      REKEY_OIDC_REDIRECT_URI: ${REKEY_OIDC_REDIRECT_URI:-}
      REKEY_OIDC_REQUIRED_GROUP: ${REKEY_OIDC_REQUIRED_GROUP:-}
      REKEY_SUPERADMIN_SUBJECTS: ${REKEY_SUPERADMIN_SUBJECTS:-}
      REKEY_CI_AUDIENCE: ${REKEY_CI_AUDIENCE:-rekey}
      REKEY_AUDIT_ANCHOR_WEBHOOK: ${REKEY_AUDIT_ANCHOR_WEBHOOK:-}
      REKEY_AUDIT_ANCHOR_TOKEN: ${REKEY_AUDIT_ANCHOR_TOKEN:-}
      REKEY_SMTP_PASSWORD: ${REKEY_SMTP_PASSWORD:-}
      REKEY_ALERT_WEBHOOK_URL: ${REKEY_ALERT_WEBHOOK_URL:-}
      REKEY_AUTO_UNSEAL: ${REKEY_AUTO_UNSEAL:-off}
      REKEY_AUTO_UNSEAL_ADDR: ${REKEY_AUTO_UNSEAL_ADDR:-}
      REKEY_AUTO_UNSEAL_TOKEN: ${REKEY_AUTO_UNSEAL_TOKEN:-}
      REKEY_AUTO_UNSEAL_KEY: ${REKEY_AUTO_UNSEAL_KEY:-}
      REKEY_AUTO_UNSEAL_MOUNT: ${REKEY_AUTO_UNSEAL_MOUNT:-transit}
      REKEY_AUTO_UNSEAL_NAMESPACE: ${REKEY_AUTO_UNSEAL_NAMESPACE:-}
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    expose: ["8000"] # not published: reachable only through the web UI

  rekey-web:
    build:
      context: ./web
      network: host
      args:
        REKEY_API_URL: http://rekey-api:8000
    restart: unless-stopped
    depends_on:
      rekey-api:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    expose: ["3000"] # not published: reachable only through the edge proxy

  # The only published service. Routes /v1 to the API and everything else to the UI, and sets
  # X-Forwarded-For itself (see deploy/nginx/rekey.conf).
  edge:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    depends_on:
      rekey-api:
        condition: service_healthy
      rekey-web:
        condition: service_healthy
    ports:
      - "${REKEY_BIND:-0.0.0.0}:${REKEY_PORT:-11000}:8080"
    volumes:
      - ./deploy/nginx/rekey.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/v1/sys/status"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  rekey-db:
