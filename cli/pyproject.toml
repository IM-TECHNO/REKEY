[project]
name = "rekey-cli"
version = "0.0.1"
description = "Rekey command-line client"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "typer>=0.12",
]

[project.scripts]
rekey = "rekey_cli.main:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rekey_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.12"
